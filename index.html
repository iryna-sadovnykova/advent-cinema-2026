<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#28560E">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Movie Advent · 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{color-scheme:light;--bg:#FFFEFF;--ink:#28560E;--muted:#53664B;--green:#28560E;--red:#CA020D;--cream:#f7f5ed;--line:#D9D4BC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}
button{font:inherit}
.wrap{width:min(1080px,100%);margin:0 auto;padding:38px 28px 72px}
header.page-heading{padding:28px 0 30px;display:block}
.kicker{text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--red);font-size:12px;margin:0 0 15px}
h1{font-size:clamp(48px,7.2vw,86px);font-weight:700;letter-spacing:-.065em;line-height:.98;margin:0}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:17px 0 0}
.toolbar{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.count{color:var(--muted);font-size:13px}
.toolbar button{border:1px solid var(--green);color:var(--green);background:transparent;border-radius:6px;padding:11px 15px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.toolbar button:hover,.toolbar button[aria-pressed="true"]{background:var(--green);color:white}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-top:12px}
.door{position:relative;aspect-ratio:1/1.13;border:0;border-radius:8px;background:var(--door-color,var(--red));color:#FFFFFF;padding:13px;display:flex;align-items:flex-start;justify-content:space-between;flex-direction:column;text-align:left;cursor:pointer;transition:background .16s ease,transform .16s ease;overflow:hidden}
.door:hover{transform:translateY(-2px)}
.door:focus-visible{outline:3px solid #C09207;outline-offset:3px}
.door.locked{cursor:not-allowed;background:var(--door-color)!important;color:#FFFFFF!important;opacity:.6}
.door.locked:hover{transform:none}
.door.past{background:#8B8B8B!important;color:#FFFFFF!important}
.door-number{font-size:clamp(24px,3vw,39px);font-weight:700;letter-spacing:-.07em;line-height:1}
.door-status{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.83}
.door.opened .door-status{opacity:1}
.door-symbol{position:absolute;right:12px;top:12px;font-size:17px;font-weight:500;line-height:1}
.footer{border-top:1px solid var(--line);padding-top:22px;margin-top:32px;color:var(--muted);font-size:12px;line-height:1.6;display:flex;flex-direction:column;gap:15px}
.tmdb-credit{flex-basis:100%;font-size:11px;line-height:1.6;color:var(--muted)}
.tmdb-credit a{color:var(--green);text-underline-offset:2px}
.modal{position:fixed;inset:0;background:#102509bd;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}
.panel{position:relative;background:var(--bg);color:var(--ink);width:min(690px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(180px,40%) 1fr;border-radius:10px}
.poster{position:relative;aspect-ratio:2/3;min-height:0;background:#E8E5D8;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;align-self:start;overflow:hidden}
.poster-label{font-size:clamp(19px,2.8vw,29px);font-weight:700;line-height:1.15;letter-spacing:-.04em;color:var(--green)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:#E8E5D8}
.poster.loading .poster-label:after{content:' …'}
.details{padding:57px 30px 30px}
.day{font-size:11px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.13em}
.details h2{font-size:clamp(26px,3.5vw,42px);line-height:1.1;letter-spacing:-.05em;margin:14px 0}
.movie-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.runtime:not([hidden])::before{content:"·";margin-right:10px}
.runtime[hidden]{display:none}
.details p{font-size:14px;line-height:1.65;margin-top:28px}.synopsis{max-width:40ch}
.hint{margin-top:28px;font-size:12px;line-height:1.6;color:var(--muted)}
.close{position:absolute;top:12px;right:12px;z-index:5;border:none;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:6px;font-size:24px;line-height:1;cursor:pointer}
@media(max-width:850px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}header{padding-top:50px}}
@media(max-width:620px){.wrap{padding:22px 16px 44px}.topline{padding-bottom:16px}header{display:block;padding:44px 0 20px}.toolbar{margin-top:28px;flex-direction:row;align-items:center;justify-content:space-between;gap:12px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.door{padding:10px}.door-number{font-size:28px}.door-symbol{top:9px;right:9px;font-size:13px}.door-status{font-size:8px}.footer{display:block}.panel{grid-template-columns:1fr}.poster{width:min(100%,250px);aspect-ratio:2/3;align-self:center;margin:0 auto}.details{padding:20px 24px 30px}.details p{margin-top:19px}}
@media(max-width:360px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.door,.toolbar button{transition:none}.door:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
<header class="page-heading"><p class="kicker">The holiday film calendar</p><h1>Movie Advent</h1><p class="sub">A new movie every day, December 1 — January 1.</p></header>
<section class="grid" id="calendar" aria-label="Movie advent calendar"></section>
<footer class="footer"><div class="tmdb-credit">Movie posters provided by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</div></footer>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="movie-title">
<div class="panel">
<button class="close" id="close" aria-label="Close">×</button>
<div class="poster" id="poster"><div class="poster-label" id="poster-label"></div></div>
<div class="details"><div class="day" id="day"></div><h2 id="movie-title"></h2><div class="movie-meta"><span class="year" id="year"></span><span class="runtime" id="runtime" hidden></span></div>
<p class="synopsis" id="movie-description"></p>
</div>
</div></div>
<script>
const titles=[['Miracle on 34th Street',1947],['Remember the Night',1940],['Plácido',1961],['The Shop Around the Corner',1940],['Batman Returns',1992],['Arthur Christmas',2011],['Tangerine',2015],['Trading Places',1983],['Better Watch Out',2016],['Kiss Kiss Bang Bang',2005],['Gremlins',1984],['Scrooge',1951],['A Christmas Story',1983],['Щедрик',2022],['Anna and the Apocalypse',2017],['A Christmas Tale',2008],['Rare Exports: A Christmas Tale',2010],['Carol',2015],['Пекельна хоругва, або Різдво козацьке',2019],['Tokyo Godfathers',2003],['Hogfather',2006],['Edward Scissorhands',1990],['Happiest Season',2020],['The Muppet Christmas Carol',1992],['The Holdovers',2023],['Die Hard',1988],['The Thin Man',1934],['Памфір',2022],['The Gold Rush',1925],['Holiday',1938],['After the Thin Man',1936],['The Apartment',1960]];
const movieDescriptions=[
  "A department-store Santa insists he is the real Kris Kringle, inspiring a young girl and an unforgettable courtroom case.",
  "A woman arrested just before Christmas is released into a prosecutor’s custody, leading to an unexpected holiday journey.",
  "In a small Spanish town, a businessman’s plan to impress a visiting charity delegation spirals into a sharp holiday satire.",
  "Two quarrelling coworkers at a Budapest shop unknowingly fall in love through anonymous letters.",
  "Gotham faces the Penguin and Catwoman as Batman navigates a dark, snow-covered Christmas season.",
  "Santa’s well-meaning son Arthur sets out on a frantic mission to deliver one forgotten Christmas present.",
  "On Christmas Eve in Los Angeles, two transgender friends embark on a chaotic search for answers across the city.",
  "A wealthy investor and a street hustler swap circumstances after a cruel bet by two powerful businessmen.",
  "A babysitting job takes a sinister turn when a young boy and his friend have plans of their own.",
  "A detective story unfolds in Los Angeles when a petty thief, an actress, and a private investigator become tangled in murder.",
  "A boy’s unusual Christmas gift brings mischievous creatures—and absolute mayhem—to a sleepy town.",
  "A bitter miser encounters three spirits who offer him a chance to change his life on Christmas Eve.",
  "A young boy in 1940s Indiana is determined to get a Red Ryder BB gun for Christmas, despite everyone’s warnings.",
  "As war engulfs their city, Ukrainian, Polish, and Jewish families struggle to protect their children, finding hope and solidarity through the song “Shchedryk”.",
  "As a zombie outbreak hits a Scottish town, a teenager and her friends sing and fight their way toward safety.",
  "A troubled French family reunites for Christmas, stirring up old resentments, complicated loyalties, and unexpected connections.",
  "A Finnish village discovers something frightening buried beneath the ice as Christmas approaches.",
  "Two women develop a powerful connection in 1950s New York, despite the expectations and restrictions surrounding them.",
  "A resourceful Cossack must outwit the Devil before Christmas in a fantastical adventure drawn from Ukrainian folklore and mythology.",
  "Three unhoused people in Tokyo discover an abandoned baby on Christmas Eve and set off to find her family.",
  "In a world where holidays have a life of their own, Death steps in when the Hogfather mysteriously disappears.",
  "A gentle young man with scissors for hands arrives in suburbia, where his gifts and differences change a community.",
  "Returning home for Christmas, a woman plans to propose to her girlfriend—until she learns her partner hasn’t come out.",
  "The Muppets bring humor, music, and heart to Dickens’s tale of Ebenezer Scrooge and his Christmas visitors.",
  "A grumpy teacher, a grieving student, and a school cook spend the winter holidays together at an almost-empty boarding school.",
  "During a Christmas party at a Los Angeles skyscraper, an off-duty detective battles criminals who have seized the building.",
  "A retired detective and his witty wife become caught up in a glamorous murder mystery over the holidays.",
  "Returning to his village near the Ukrainian border, a former smuggler hopes to live honestly, but a family crisis draws him back toward danger amid Malanka festivities.",
  "Charlie Chaplin’s Little Tramp heads to Alaska during the Gold Rush, encountering hardship, friendship, and romance.",
  "A free-spirited young man falls for a wealthy woman but refuses to surrender his independence for her family’s expectations.",
  "Nick and Nora Charles investigate another murder while navigating witty banter, high society, and New Year festivities.",
  "A lonely office worker lends his apartment to executives seeking affairs, complicating his career and romantic life."
];
// Red, green, gold repeating palette used by every calendar door.
const doorPalette=['#CA020D','#28560E','#946900'];
// Curated TMDB poster paths are generated once by the GitHub Action.
const $=id=>document.getElementById(id);
let posterManifestPromise=null;
function posterManifest(){
 if(!posterManifestPromise){
  posterManifestPromise=fetch('./posters.json',{cache:'no-cache'})
   .then(r=>r.ok?r.json():{posters:{}})
   .catch(()=>({posters:{}}));
 }
 return posterManifestPromise;
}
const localPosters={
 13:'./posters/shchedryk.jpeg',
 27:'./posters/pamfir.jpeg',
 18:'./posters/pekelna-khoruhva.jpeg'
};
async function posterUrl(i){
 if(localPosters[i])return localPosters[i];
 const data=await posterManifest();
 const path=data.posters?.[i];
 if(typeof path!=='string'||!/^\/[a-zA-Z0-9_.-]+\.(jpg|jpeg|png|webp)$/.test(path))return null;
 return 'https://image.tmdb.org/t/p/w500'+path;
}
let preview=true,posterRequest=0,currentMovieIndex=null;
function dateFor(i){return i===31?'2027-01-01':`2026-12-${String(i+1).padStart(2,'0')}`}
function kyivToday(){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const get=t=>parts.find(p=>p.type===t).value;
 return `${get('year')}-${get('month')}-${get('day')}`;
}
function passed(i){return kyivToday()>=dateFor(i)}
function isPast(i){return kyivToday()>dateFor(i)}
function unlocked(i){return preview||passed(i)}
function render(){
 const grid=$('calendar');grid.innerHTML='';
 titles.forEach(([title,year],i)=>{
  const b=document.createElement('button');
  b.className='door'+(unlocked(i)?'':' locked')+(passed(i)?' opened':'')+(isPast(i)?' past':'');
  b.style.setProperty('--door-color',doorPalette[i%doorPalette.length]);
  b.setAttribute('aria-label',(i===31?'January 1':`December ${i+1}`)+(unlocked(i)?`, ${title}`:', locked'));
  b.innerHTML=`<span class="door-number">${i===31?'01':String(i+1).padStart(2,'0')}</span><span class="door-status">${i===31?'January':'December'}</span>`;
  b.onclick=()=>{if(!unlocked(i)){alert('This door opens on '+(i===31?'January 1, 2027':`December ${i+1}, 2026`)+' in Kyiv.');return}show(i)};
  grid.appendChild(b);
 });
}
function show(i){
 if(!unlocked(i))return;
 currentMovieIndex=i;
 const [title,year]=titles[i];
 $('day').textContent=i===31?'New Year’s Day · January 1':`December ${i+1}`;
 $('movie-title').textContent=title;$('year').textContent=year;$('movie-description').textContent=movieDescriptions[i];
 const runtime=$('runtime');runtime.hidden=true;runtime.textContent='';
 posterManifest().then(data=>{
  if(currentMovieIndex!==i || !$('modal').classList.contains('show'))return;
  const minutes=Number(data.runtimes?.[i]);
  if(Number.isInteger(minutes)&&minutes>0){
   runtime.textContent=minutes>=60?`${Math.floor(minutes/60)}h ${String(minutes%60).padStart(2,'0')}m`:`${minutes} min`;
   runtime.hidden=false;
  }
 });
 const p=$('poster');p.querySelectorAll('img').forEach(el=>el.remove());
 $('poster-label').textContent=title;$('poster-label').style.display='block';p.classList.add('loading');
 $('modal').classList.add('show');$('close').focus();
 const request=++posterRequest;
 posterUrl(i).then(url=>{
  if(request!==posterRequest)return;
  if(!url){p.classList.remove('loading');return}
  const img=new Image();img.alt=`${title} (${year}) film artwork`;
  img.onload=()=>{if(request!==posterRequest)return;p.appendChild(img);$('poster-label').style.display='none';p.classList.remove('loading')};
  img.onerror=()=>{if(request===posterRequest)p.classList.remove('loading')};
  img.src=url;
 }).catch(()=>p.classList.remove('loading'));
}
function navigateMovie(direction){
 if(currentMovieIndex===null || !$('modal').classList.contains('show'))return;
 for(let step=1;step<=titles.length;step++){
  const next=(currentMovieIndex+direction*step+titles.length*2)%titles.length;
  if(unlocked(next)){if(next!==currentMovieIndex)show(next);return}
 }
}
// Touch swipes navigate movies without interfering with vertical scrolling.
let swipeStart=null;
const swipeSurface=$('modal').querySelector('.panel');
swipeSurface.addEventListener('touchstart',event=>{
 if(event.touches.length!==1){swipeStart=null;return;}
 const touch=event.touches[0];
 swipeStart={x:touch.clientX,y:touch.clientY};
},{passive:true});
swipeSurface.addEventListener('touchend',event=>{
 if(!swipeStart||event.changedTouches.length!==1){swipeStart=null;return;}
 const touch=event.changedTouches[0];
 const dx=touch.clientX-swipeStart.x;
 const dy=touch.clientY-swipeStart.y;
 swipeStart=null;
 // Require a deliberate, predominantly horizontal gesture.
 if(Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.4){
  navigateMovie(dx<0?1:-1);
 }
},{passive:true});
swipeSurface.addEventListener('touchcancel',()=>{swipeStart=null;},{passive:true});
$('close').onclick=()=>{$('modal').classList.remove('show');currentMovieIndex=null;posterRequest++};
$('modal').onclick=e=>{if(e.target===$('modal'))$('close').click()};
document.addEventListener('keydown',e=>{
 if(!$('modal').classList.contains('show'))return;
 if(e.key==='Escape'){$('close').click();return}
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
  e.preventDefault();
  navigateMovie(e.key==='ArrowRight'?1:-1);
 }
});
render();setInterval(render,60000);
// Poster paths are static; no background search or download is necessary.
</script>
</body>
</html>
