name: Curate TMDB posters
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve posters from TMDB
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/update_posters.py
      - name: Commit poster manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posters.json
          if ! git diff --cached --quiet; then
            git commit -m "Update curated TMDB poster paths"
            git push
          fi
